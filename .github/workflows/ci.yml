name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  ORT_VER: "1.20.1"
  ORT_ROOT: /tmp/onnxruntime-linux-x64-1.20.1

jobs:
  scripts-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: bash -n scripts
        run: |
          set -e
          for s in scripts/*.sh; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: GDScript mini/maxi float footgun lint
        run: python scripts/check_gdscript_int_math.py godot-demo

      - name: plugin CPU/RSS bench (ORT)
        run: |
          pip install -q onnxruntime
          python3 gdextension/tools/bench_plugins.py | tee /tmp/vizemes-bench.txt
          grep -q BENCH_OK /tmp/vizemes-bench.txt

      - name: resolve_micromamba rejects missing
        run: |
          set +e
          env -i HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin \
            bash scripts/resolve_micromamba.sh
          test $? -eq 1

      - name: resolve_micromamba accepts fake binary
        run: |
          set -e
          mkdir -p /tmp/vizemes-ci-home/micromamba/bin
          printf '#!/bin/sh\necho fake\n' > /tmp/vizemes-ci-home/micromamba/bin/micromamba
          chmod +x /tmp/vizemes-ci-home/micromamba/bin/micromamba
          out=$(HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin bash scripts/resolve_micromamba.sh)
          test "$out" = "/tmp/vizemes-ci-home/micromamba/bin/micromamba"

      - name: install python deps
        run: pip install -r requirements.txt

      - name: export_godot_package on fixture
        run: python scripts/ci_test_export_fixture.py

      - name: Upload Godot export artefact
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-ci-fixture-ubuntu
          path: data/export/ci-fixture/
          if-no-files-found: error
          retention-days: 14

  smoke-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Decide whether to retrain smoke ONNX
        id: train
        run: |
          set -euo pipefail
          RETRAIN=0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RETRAIN=1
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --name-only HEAD~1 HEAD | grep -qE \
              '^(scripts/(train_viseme_smoke|build_train_tensors|build_demo_inputs|ci_test_export_fixture)\.py|requirements-train\.txt|data/tensors/)'; then
              RETRAIN=0
            else
              RETRAIN=1
            fi
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$BASE"...HEAD | grep -qE \
              '^(scripts/(train_viseme_smoke|build_train_tensors|build_demo_inputs|ci_test_export_fixture)\.py|requirements-train\.txt|data/tensors/)'; then
              RETRAIN=1
            fi
          fi
          echo "retrain=$RETRAIN" >> "$GITHUB_OUTPUT"
          echo "retrain=$RETRAIN"

      - name: install train deps (CPU torch)
        if: steps.train.outputs.retrain == '1'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile onnx onnxscript

      - name: install sanity deps only
        if: steps.train.outputs.retrain != '1'
        run: pip install -r requirements.txt onnx onnxruntime

      - name: build tensors + export smoke ONNX
        if: steps.train.outputs.retrain == '1'
        run: |
          set -euo pipefail
          python scripts/ci_test_export_fixture.py
          python scripts/build_train_tensors.py --subset ci-fixture
          python scripts/train_viseme_smoke.py --subset ci-fixture --epochs 40 --hidden 64 \
            --export-onnx export/ci-smoke/model.onnx
          python scripts/build_demo_inputs.py --subset ci-fixture
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/model.json
          test -f export/ci-smoke/demo_inputs.csv
          python -c 'import json; print("best_val_acc", json.load(open("export/ci-smoke/model.json"))["best_val_acc"])'

      - name: sanity check committed smoke ONNX
        run: |
          set -euo pipefail
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/demo_inputs.csv
          python scripts/sanity_check_onnx.py | tee /tmp/onnx-sanity.txt
          grep -q 'hit_rate=' /tmp/onnx-sanity.txt

      - name: Upload smoke ONNX artefact
        uses: actions/upload-artifact@v7
        with:
          name: viseme-smoke-onnx
          path: export/ci-smoke/
          if-no-files-found: error
          retention-days: 14

  # Host C mel + ORT only (~10s). MelFrontend Godot .so builds on nixos-self-hosted.
  inference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          if [[ ! -f "${ORT_ROOT}/lib/libonnxruntime.so.1" ]]; then
            curl -fsSL -o /tmp/ort.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
            tar -C /tmp -xzf /tmp/ort.tgz
          fi

      - name: gdextension host mel parity + make smoke-csv (C mel + ORT)
        run: |
          set -euo pipefail
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/demo_inputs.csv
          test -f export/ci-smoke/ci-fixture.wav
          pip install -q numpy
          make -C gdextension dump-mel
          python3 scripts/compare_mel_parity.py export/ci-smoke/ci-fixture.wav
          cd gdextension
          make ORT_ROOT="$ORT_ROOT" smoke-csv | tee /tmp/vizemes-smoke-csv.txt
          grep -q 'GDEXT_ORT_CSV_SMOKE_OK' /tmp/vizemes-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/vizemes-smoke-csv.txt

  # MelFrontend godot-cpp + headless Godot smokes on Julian's NixOS runner.
  nixos-self-hosted:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    env:
      TMPDIR: /var/tmp
      MEL_SCONS_CACHE: /var/tmp/github-runner-cache/scons/vizemes-mel
      ONNX_LOADER_SCONS_CACHE: /var/tmp/github-runner-cache/scons/godot-onnx-loader
      ONNX_LOADER_ROOT: /var/tmp/github-runner-cache/godot-onnx-loader-src
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Need merge-base with PR base for path detect (shallow = false green skip).
          fetch-depth: 0

      - name: Detect MelFrontend / Godot smoke changes
        id: mel
        run: |
          set -euo pipefail
          RUN=1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if changed="$(git diff --name-only "${BASE}...HEAD" 2>/dev/null)"; then
              if ! echo "$changed" | grep -qE \
                '^(gdextension/|godot-demo/|flake\.nix|\.github/workflows/ci\.yml)'; then
                RUN=0
              fi
            else
              echo "path detect failed (no merge base?); forcing nixos mel smoke"
              RUN=1
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "nixos_mel=$RUN"

      - name: MelFrontend GDExtension scons (NixOS / Julian path)
        if: steps.mel.outputs.run == '1'
        run: |
          set -euo pipefail
          mkdir -p "$MEL_SCONS_CACHE"
          nix --version
          nix develop .#train --command bash -c '
            set -euo pipefail
            export SCONS_CACHE='"$MEL_SCONS_CACHE"'
            cd gdextension
            scons -j"$(nproc)" platform=linux target=template_debug
            test -f ../addons/vizemes_mel/bin/libvizemes_mel.linux.template_debug.x86_64.so
          '

      - name: Godot mel+lipsync smoke (NixOS, Godot 4.6 MS-ORT)
        if: steps.mel.outputs.run == '1'
        run: |
          set -euo pipefail
          # Same gate Julian hit: bare `nix develop` GODOT_BIN is still 4.5.1.
          # Use godot_46_ms_ort + nixos-26.05 godot_4_6 (see julian_vizemes_smoke.sh).
          mkdir -p "$ONNX_LOADER_SCONS_CACHE"
          if [[ ! -d "$ONNX_LOADER_ROOT/.git" ]]; then
            git clone --depth 1 --recurse-submodules https://github.com/DynamicDevices/godot-onnx-loader.git "$ONNX_LOADER_ROOT"
          else
            git -C "$ONNX_LOADER_ROOT" fetch --depth 1 origin main
            git -C "$ONNX_LOADER_ROOT" checkout -f FETCH_HEAD
            git -C "$ONNX_LOADER_ROOT" submodule update --init --recursive
          fi
          ln -sfn "$ONNX_LOADER_ROOT/addons/onnx_loader" godot-demo/addons/onnx_loader
          test -f addons/vizemes_mel/bin/libvizemes_mel.linux.template_debug.x86_64.so
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/ci-fixture.wav
          export SCONS_CACHE="$ONNX_LOADER_SCONS_CACHE"
          (cd "$ONNX_LOADER_ROOT" && bash tools/godot_46_ms_ort.sh)
          NIXPKGS="${NIXPKGS:-github:nixos/nixpkgs/nixos-26.05}"
          nix shell "${NIXPKGS}#godot_4_6" --command bash -c '
            set -euo pipefail
            G=$(command -v godot4 || command -v godot || true)
            test -n "$G" && test -x "$G"
            export GODOT_BIN="$G"
            unset ONNX_ORT_BIN
            export ONNX_LOADER_SKIP_SESSION_RELEASE=1
            cd "'"$GITHUB_WORKSPACE"'"
            bash godot-demo/tools/gdscript_check_only.sh
            bash godot-demo/tools/godot_mel_smoke.sh
            # Julian mid 993: TCN load_model free(): invalid size under Nix Godot.
            "$G" --headless --path godot-demo --script res://tools/tcn_load_probe.gd 2>&1 | tee /tmp/vizemes-tcn-load-probe.txt
            grep -q GODOT_TCN_LOAD_PROBE_OK /tmp/vizemes-tcn-load-probe.txt
            ! grep -qE 'free\\(\\): invalid size|Aborted' /tmp/vizemes-tcn-load-probe.txt
          '
