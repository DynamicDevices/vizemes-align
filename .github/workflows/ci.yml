name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  scripts-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n scripts
        run: |
          set -e
          for s in scripts/*.sh; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: resolve_micromamba rejects missing
        run: |
          set +e
          env -i HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin \
            bash scripts/resolve_micromamba.sh
          test $? -eq 1

      - name: resolve_micromamba accepts fake binary
        run: |
          set -e
          mkdir -p /tmp/vizemes-ci-home/micromamba/bin
          printf '#!/bin/sh\necho fake\n' > /tmp/vizemes-ci-home/micromamba/bin/micromamba
          chmod +x /tmp/vizemes-ci-home/micromamba/bin/micromamba
          out=$(HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin bash scripts/resolve_micromamba.sh)
          test "$out" = "/tmp/vizemes-ci-home/micromamba/bin/micromamba"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install python deps
        run: pip install -r requirements.txt

      - name: export_godot_package on fixture
        run: python scripts/ci_test_export_fixture.py

      - name: Upload Godot export artefact
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-ci-fixture-ubuntu
          path: data/export/ci-fixture/
          if-no-files-found: error
          retention-days: 14

  # Capped smoke → ONNX for Julian to download (ubuntu; not NixOS /run tmpfs).
  smoke-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install train deps (CPU torch)
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile onnx onnxscript

      - name: build tensors + export smoke ONNX
        run: |
          set -euo pipefail
          # Same tiny fixture as Godot export CI (no LibriSpeech on runner).
          python scripts/ci_test_export_fixture.py
          python scripts/build_train_tensors.py --subset ci-fixture
          python scripts/train_viseme_smoke.py --subset ci-fixture --epochs 40 --hidden 64 \
            --export-onnx export/ci-smoke/model.onnx
          python scripts/build_demo_inputs.py --subset ci-fixture
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/model.json
          test -f export/ci-smoke/demo_inputs.csv
          python -c 'import json; print("best_val_acc", json.load(open("export/ci-smoke/model.json"))["best_val_acc"])'
          python scripts/sanity_check_onnx.py | tee /tmp/onnx-sanity.txt
          grep -q 'hit_rate=' /tmp/onnx-sanity.txt

      - name: Upload smoke ONNX artefact
        uses: actions/upload-artifact@v7
        with:
          name: viseme-smoke-onnx
          path: export/ci-smoke/
          if-no-files-found: error
          retention-days: 14

  # Shared OnnxLoader (godot-onnx-loader) + host C runtime Makefile smokes.
  inference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install scons
        run: pip install scons

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          VER=1.20.1
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${VER}/onnxruntime-linux-x64-${VER}.tgz"
          tar -C /tmp -xzf /tmp/ort.tgz
          echo "ORT_ROOT=/tmp/onnxruntime-linux-x64-${VER}" >> "$GITHUB_ENV"
          echo "ORT_LIB=/tmp/onnxruntime-linux-x64-${VER}/lib" >> "$GITHUB_ENV"

      - name: checkout godot-onnx-loader
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules \
            https://github.com/DynamicDevices/godot-onnx-loader.git /tmp/godot-onnx-loader

      - name: godot-onnx-loader scons smoke-csv
        run: |
          set -euo pipefail
          export LIBRARY_PATH="${ORT_LIB}${LIBRARY_PATH:+:$LIBRARY_PATH}"
          cd /tmp/godot-onnx-loader
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD
          scons platform=linux target=template_debug
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
          test -f addons/onnx_loader/bin/libonnxruntime.so.1
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q libonnxruntime
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q 'libstdc++'
          scons platform=linux target=template_debug smoke-csv
          scons platform=linux target=template_debug smoke-dlopen-ort
          grep -q 'ONNX_LOADER_CSV_SMOKE_OK' /tmp/onnx-loader-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/onnx-loader-smoke-csv.txt
          grep -q 'ONNX_DLOPEN_TEARDOWN_OK' /tmp/onnx-loader-smoke-dlopen.txt

      - name: gdextension host make smoke-csv (C mel + ORT, no Godot .so)
        run: |
          set -euo pipefail
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/demo_inputs.csv
          cd gdextension
          make ORT_ROOT="$ORT_ROOT" smoke-csv | tee /tmp/vizemes-smoke-csv.txt
          grep -q 'GDEXT_ORT_CSV_SMOKE_OK' /tmp/vizemes-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/vizemes-smoke-csv.txt

      - name: vizemes MelFrontend GDExtension (scons, no ORT)
        run: |
          set -euo pipefail
          git submodule update --init gdextension/godot-cpp
          cd gdextension
          scons platform=linux target=template_debug
          test -f godot/bin/libvizemes_mel.linux.template_debug.x86_64.so

  nixos-self-hosted:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    # Runner workdir lives on /run tmpfs (2G). Keep pip/nix caches on disk.
    env:
      PIP_CACHE_DIR: /var/tmp/github-runner-cache/pip
      XDG_CACHE_HOME: /var/tmp/github-runner-cache/xdg
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@v7

      - name: Prove NixOS runner + flake shell
        run: |
          set -euo pipefail
          mkdir -p "$PIP_CACHE_DIR" "$XDG_CACHE_HOME"
          cat /etc/os-release | head -5
          nix --version
          command -v steam-run
          # Non-login bash: login (-l) resets PATH and drops flake shellHook .venv.
          nix develop --command bash -c 'python3 --version; ffmpeg -version | head -1'

      - name: export_godot_package on fixture (nix shell)
        run: |
          set -euo pipefail
          nix develop --command bash -c 'python3 -c "import textgrid"; python3 scripts/ci_test_export_fixture.py'

      - name: godot-onnx-loader Nix Godot csv_smoke (Julian path)
        run: |
          set -euo pipefail
          rm -rf /var/tmp/godot-onnx-loader-ci
          git clone --depth 1 --recurse-submodules \
            https://github.com/DynamicDevices/godot-onnx-loader.git /var/tmp/godot-onnx-loader-ci
          cd /var/tmp/godot-onnx-loader-ci
          rm -rf addons/onnx_loader/bin/libonnxruntime.so*
          nix develop --command bash -c '
            set -euo pipefail
            git submodule update --init --recursive
            scons platform=linux target=template_debug
            so=addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
            test -f "$so"
            ! ldd "$so" | grep -q libonnxruntime
            ! ldd "$so" | grep -q libstdc++
            scons platform=linux target=template_debug smoke-dlopen-ort
            bash tools/smoke_bad_model.sh
            bash tools/godot_csv_smoke.sh
          '

      - name: Upload Godot export artefact
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-ci-fixture-nixos
          path: data/export/ci-fixture/
          if-no-files-found: error
          retention-days: 14
