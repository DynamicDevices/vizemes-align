name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  ORT_VER: "1.20.1"
  ORT_ROOT: /tmp/onnxruntime-linux-x64-1.20.1

jobs:
  scripts-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: bash -n scripts
        run: |
          set -e
          for s in scripts/*.sh; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: resolve_micromamba rejects missing
        run: |
          set +e
          env -i HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin \
            bash scripts/resolve_micromamba.sh
          test $? -eq 1

      - name: resolve_micromamba accepts fake binary
        run: |
          set -e
          mkdir -p /tmp/vizemes-ci-home/micromamba/bin
          printf '#!/bin/sh\necho fake\n' > /tmp/vizemes-ci-home/micromamba/bin/micromamba
          chmod +x /tmp/vizemes-ci-home/micromamba/bin/micromamba
          out=$(HOME=/tmp/vizemes-ci-home PATH=/usr/bin:/bin bash scripts/resolve_micromamba.sh)
          test "$out" = "/tmp/vizemes-ci-home/micromamba/bin/micromamba"

      - name: install python deps
        run: pip install -r requirements.txt

      - name: export_godot_package on fixture
        run: python scripts/ci_test_export_fixture.py

      - name: Upload Godot export artefact
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-ci-fixture-ubuntu
          path: data/export/ci-fixture/
          if-no-files-found: error
          retention-days: 14

  smoke-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Decide whether to retrain smoke ONNX
        id: train
        run: |
          set -euo pipefail
          RETRAIN=0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RETRAIN=1
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --name-only HEAD~1 HEAD | grep -qE \
              '^(scripts/(train_viseme_smoke|build_train_tensors|build_demo_inputs|ci_test_export_fixture)\.py|requirements-train\.txt|data/tensors/)'; then
              RETRAIN=0
            else
              RETRAIN=1
            fi
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$BASE"...HEAD | grep -qE \
              '^(scripts/(train_viseme_smoke|build_train_tensors|build_demo_inputs|ci_test_export_fixture)\.py|requirements-train\.txt|data/tensors/)'; then
              RETRAIN=1
            fi
          fi
          echo "retrain=$RETRAIN" >> "$GITHUB_OUTPUT"
          echo "retrain=$RETRAIN"

      - name: install train deps (CPU torch)
        if: steps.train.outputs.retrain == '1'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile onnx onnxscript

      - name: install sanity deps only
        if: steps.train.outputs.retrain != '1'
        run: pip install -r requirements.txt onnx onnxruntime

      - name: build tensors + export smoke ONNX
        if: steps.train.outputs.retrain == '1'
        run: |
          set -euo pipefail
          python scripts/ci_test_export_fixture.py
          python scripts/build_train_tensors.py --subset ci-fixture
          python scripts/train_viseme_smoke.py --subset ci-fixture --epochs 40 --hidden 64 \
            --export-onnx export/ci-smoke/model.onnx
          python scripts/build_demo_inputs.py --subset ci-fixture
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/model.json
          test -f export/ci-smoke/demo_inputs.csv
          python -c 'import json; print("best_val_acc", json.load(open("export/ci-smoke/model.json"))["best_val_acc"])'

      - name: sanity check committed smoke ONNX
        run: |
          set -euo pipefail
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/demo_inputs.csv
          python scripts/sanity_check_onnx.py | tee /tmp/onnx-sanity.txt
          grep -q 'hit_rate=' /tmp/onnx-sanity.txt

      - name: Upload smoke ONNX artefact
        uses: actions/upload-artifact@v7
        with:
          name: viseme-smoke-onnx
          path: export/ci-smoke/
          if-no-files-found: error
          retention-days: 14

  inference-smoke:
    runs-on: ubuntu-latest
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scons + ORT cache
        uses: actions/cache@v4
        with:
          path: |
            .scons-cache
            /tmp/onnxruntime-linux-x64-1.20.1
          key: mel-scons-${{ runner.os }}-${{ hashFiles('gdextension/SConstruct', 'gdextension/custom.py', 'gdextension/src/**', 'gdextension/godot-cpp/**') }}
          restore-keys: |
            mel-scons-${{ runner.os }}-

      - name: install scons
        run: pip install scons

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          if [[ ! -f "${ORT_ROOT}/lib/libonnxruntime.so.1" ]]; then
            curl -fsSL -o /tmp/ort.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
            tar -C /tmp -xzf /tmp/ort.tgz
          fi

      - name: gdextension host make smoke-csv (C mel + ORT, no Godot .so)
        run: |
          set -euo pipefail
          test -f export/ci-smoke/model.onnx
          test -f export/ci-smoke/demo_inputs.csv
          cd gdextension
          make ORT_ROOT="$ORT_ROOT" smoke-csv | tee /tmp/vizemes-smoke-csv.txt
          grep -q 'GDEXT_ORT_CSV_SMOKE_OK' /tmp/vizemes-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/vizemes-smoke-csv.txt

      - name: vizemes MelFrontend GDExtension (scons, no ORT)
        run: |
          set -euo pipefail
          cd gdextension
          scons -j"$(nproc)" platform=linux target=template_debug
          test -f godot/bin/libvizemes_mel.linux.template_debug.x86_64.so

  nixos-self-hosted:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    env:
      PIP_CACHE_DIR: /var/tmp/github-runner-cache/pip
      XDG_CACHE_HOME: /var/tmp/github-runner-cache/xdg
      TMPDIR: /var/tmp
      LOADER_CLONE: /var/tmp/godot-onnx-loader-ci
      SCONS_CACHE: /var/tmp/github-runner-cache/scons/godot-onnx-loader
    steps:
      - uses: actions/checkout@v7

      - name: Prove NixOS runner + flake shell
        run: |
          set -euo pipefail
          mkdir -p "$PIP_CACHE_DIR" "$XDG_CACHE_HOME" "$SCONS_CACHE"
          cat /etc/os-release | head -5
          nix --version
          command -v steam-run
          nix develop --command bash -c 'python3 --version; ffmpeg -version | head -1'

      - name: export_godot_package on fixture (nix shell)
        run: |
          set -euo pipefail
          nix develop --command bash -c 'python3 -c "import textgrid"; python3 scripts/ci_test_export_fixture.py'

      - name: godot-onnx-loader Nix Godot csv_smoke (Julian path)
        run: |
          set -euo pipefail
          if [[ -d "$LOADER_CLONE/.git" ]]; then
            git -C "$LOADER_CLONE" fetch --depth 1 origin main
            git -C "$LOADER_CLONE" checkout FETCH_HEAD
            git -C "$LOADER_CLONE" submodule update --init --recursive
          else
            git clone --depth 1 --recurse-submodules \
              https://github.com/DynamicDevices/godot-onnx-loader.git "$LOADER_CLONE"
          fi
          cd "$LOADER_CLONE"
          rm -rf addons/onnx_loader/bin/libonnxruntime.so*
          nix develop --command bash -c '
            set -euo pipefail
            export SCONS_CACHE='"$SCONS_CACHE"'
            scons -j"$(nproc)" platform=linux target=template_debug smoke-dlopen-ort
            so=addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
            test -f "$so"
            ! ldd "$so" | grep -q libonnxruntime
            ! ldd "$so" | grep -q libstdc++
            bash tools/smoke_bad_model.sh
            bash tools/godot_csv_smoke.sh
          '

      - name: Upload Godot export artefact
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-ci-fixture-nixos
          path: data/export/ci-fixture/
          if-no-files-found: error
          retention-days: 14
